# Ekran başına ilk deneme ölçümleri — öğrenme döngüsünün işe yarayıp yaramadığını gösterir.
# ui-test-verify skill'i her ekran kodlandığında bir kayıt ekler. Retro akıştan akışa eğilime bakar.
#
# Alanlar:
#   screen            ekran kimliği (C4, B3 …)
#   flow              akış harfi
#   date              kodlandığı gün
#   states            tasarım durumu sayısı
#   first_pass_diff   ilk render'da en kötü durumun AA-toleranslı fark yüzdesi (compare_design_package.py "diff")
#   final_diff        kabul edildiğinde en kötü durum
#   fix_rounds        eşiğe inene kadar yapılan düzeltme turu (kod veya tasarım)
#   text_check_fails  check_design_texts.py'nin ilk çalıştırmadaki hatalı metin sayısı
#   core_changes      kod ajanının core bileşenlerde yaptığı değişiklik sayısı (spec eksikliğinin göstergesi)
#   learnings         bu ekranda açılan/artırılan öğrenim kayıtları
#   note              kısa açıklama

