# Tasarım zinciri öğrenim günlüğü (akış → kart → Figma → paket → kod → doğrulama)
#
# Alan adları İngilizce, içerik Türkçe. Her skill'in son adımı bu dosyaya kayıt eklemektir.
# Doğrulama ve rapor:  python3 ai/design/scripts/learnings.py check | report
#
# Alanlar:
#   id              L-<3 hane>, artan
#   date            ilk görüldüğü gün (YYYY-MM-DD)
#   stage_caused    hatanın YAPILDIĞI aşama
#   stage_detected  hatanın FARK EDİLDİĞİ aşama
#                   aşamalar: flow | card | figma | package | code | verify | tooling
#   type            contract-gap      sözleşmede kural/bilgi yoktu
#                   process-skipped   kural vardı, uygulanmadı
#                   tool-pitfall      aracın beklenmedik davranışı
#                   misinterpretation kural/veri yanlış yorumlandı
#                   environment       ortam/altyapı sorunu (derleme, ağ, JDK)
#   symptom         ne görüldü
#   root_cause      neden oldu
#   fix             o an ne yapıldı
#   occurrences     kaç kez görüldü (aynı kök neden tekrar görülürse artır, yeni kayıt açma)
#   seen_in         görüldüğü ekran/iş listesi
#   measure         kalıcı önlem (yoksa null). kind: check | contract | skill | code | note
#                   ref: dosya yolu ya da skill adı (#bölüm)
#   status          open (önlem yok) | mitigated (önlem var) | retired (artık geçerli değil)
#
# Terfi kuralı: occurrences >= 2 ve measure null ise retro'da önlem önerilir.
# Önlem tercih sırası: check > contract > skill > note.

