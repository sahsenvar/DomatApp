name: CI
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: the KtorfitX Gradle plugin (cn.ktorfitx:multiplatform-gradle-plugin,
      # applied in feature/auth/data) declares a minimum JVM runtime of 21 for the *Gradle
      # process itself*. Independent of this: the project's own Kotlin/Java compilation still
      # targets JVM 17 bytecode (KmpLibraryConventionPlugin's JvmTarget.JVM_17) - a newer JDK
      # running Gradle can still produce older-target bytecode, so this doesn't change what the
      # app itself targets.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android-only for now: builds :composeApp and, through its dependency graph, the Android
      # compilation of every module it pulls in transitively (:shared and almost everything under
      # :core and :feature). iOS compilation is a separate, later phase - it needs a macOS runner.
      - name: Build (Android)
        run: ./gradlew :composeApp:assembleDebug --stacktrace

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the build job's comment - KtorfitX's Gradle plugin needs JVM 21 to run under, distinct
      # from the JVM 17 bytecode the project's own modules compile to.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Report-only for now: this is detekt's first run against the whole codebase, and the
      # baseline violation count isn't known yet. Once someone has looked at the report and either
      # fixed what's real or recorded a baseline (`./gradlew detektBaseline`), drop
      # continue-on-error so new violations actually fail the build.
      - name: Detekt
        continue-on-error: true
        run: ./gradlew detekt --stacktrace
