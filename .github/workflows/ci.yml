name: CI
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21: needed to run the Gradle daemon itself (KtorfitX's Gradle plugin,
      # cn.ktorfitx:multiplatform-gradle-plugin in feature/auth/data, declares a minimum JVM
      # runtime of 21), and now also the project's own compile target - see
      # KmpLibraryConventionPlugin's comment on why (kmapper-core 2.2.2's published classes are
      # JVM-21 bytecode). One JDK, no toolchain indirection: a plain compiler-option target is
      # what actually took effect here, a jvmToolchain() pin did not.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android-only for now: builds :composeApp and, through its dependency graph, the Android
      # compilation of every module it pulls in transitively (:shared and almost everything under
      # :core and :feature). iOS compilation is a separate, later phase - it needs a macOS runner.
      - name: Build (Android)
        run: ./gradlew :composeApp:assembleDebug --stacktrace

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the build job's comment.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Report-only for now: this is detekt's first run against the whole codebase, and the
      # baseline violation count isn't known yet. Once someone has looked at the report and either
      # fixed what's real or recorded a baseline (`./gradlew detektBaseline`), drop
      # continue-on-error so new violations actually fail the build.
      - name: Detekt
        continue-on-error: true
        run: ./gradlew detekt --stacktrace
