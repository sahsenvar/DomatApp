name: CI
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two JDKs: 21 to actually run the Gradle daemon (KtorfitX's Gradle plugin,
      # cn.ktorfitx:multiplatform-gradle-plugin in feature/auth/data, declares a minimum JVM
      # runtime of 21 for the build process itself) and 17 for Gradle's own toolchain resolution
      # to find, since KmpLibraryConventionPlugin now pins `jvmToolchain(17)` for the project's
      # actual Kotlin/Java compilation. Listing 17 first, 21 last: actions/setup-java sets
      # JAVA_HOME to the *last* version installed, which needs to be 21 for the daemon; both
      # become visible to Gradle's toolchain auto-detection via the JAVA_HOME_<major>_X64 env
      # vars this action also sets.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android-only for now: builds :composeApp and, through its dependency graph, the Android
      # compilation of every module it pulls in transitively (:shared and almost everything under
      # :core and :feature). iOS compilation is a separate, later phase - it needs a macOS runner.
      - name: Build (Android)
        run: ./gradlew :composeApp:assembleDebug --stacktrace

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the build job's comment - two JDKs are needed, 21 to run Gradle/KtorfitX's plugin, 17
      # for the jvmToolchain(17) pin the project's own compilation resolves against.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Report-only for now: this is detekt's first run against the whole codebase, and the
      # baseline violation count isn't known yet. Once someone has looked at the report and either
      # fixed what's real or recorded a baseline (`./gradlew detektBaseline`), drop
      # continue-on-error so new violations actually fail the build.
      - name: Detekt
        continue-on-error: true
        run: ./gradlew detekt --stacktrace
