[versions]
agp = "9.4.0"
android-compileSdk = "37"
android-minSdk = "30"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
composeMultiplatform = "1.12.0"
# Kotlin is capped at 2.4.10 (not 2.4.20) because SKIE 0.10.14 - the newest SKIE release -
# only ships compiler support up to Kotlin 2.4.10 (touchlab/SKIE#205 is still open).
kotlin = "2.4.10"
# Compose Multiplatform publishes material3 on its own track; 1.12.0-alpha03 is the newest
# release in the line matching composeMultiplatform 1.12.0.
material3 = "1.12.0-alpha03"
firebase-gitlive = "2.7.0"
# Matches the BoM that dev.gitlive:firebase-*-android 2.7.0 itself imports.
firebase-bom = "34.18.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
# Koin deliberately NOT bumped to 4.2.x: Koin Annotations 4.2.x replaces the KSP processor
# (io.insert-koin:koin-ksp-compiler) with a Kotlin compiler plugin
# (io.insert-koin:koin-compiler-plugin + koin-compiler-gradle-plugin). That is a migration,
# not a version bump - it touches DiConventionPlugin and every module's KSP wiring.
koin = "4.1.1"
koin-annotations = "2.3.1"
ktor = "3.5.2"
# Ktorfit 2.7.4+ targets Ktor 3.5.x, which is what this project is on now.
# Note: the Ktorfit Gradle plugin 2.7.5 still hardcodes ktorfit-ksp 2.7.3 internally,
# so feature/auth/data also declares libs.ktorfit.ksp explicitly to keep the processor
# on the same version as the runtime.
ktorfit = "2.7.5"
# KSP held at 2.3.11, one behind 2.3.12: 2.3.12 introduces backing-field symbols, which changes
# what Resolver.getSymbolsWithAnnotation returns and requires processors to opt in via
# registerProcessorForNewFeatures + KSVisitorNext. :core:processor would need migrating first.
ksp = "2.3.11"
kotlinpoet = "2.4.0"
moko-resources = "0.27.0"
moko-graphics = "0.10.2"
navigation3 = "1.1.7"
multiplatformSettings = "1.3.0"
dataStoreVersion = "1.2.1"
skie = "0.10.14"
room = "2.8.5"
sqlite = "2.7.1"
coreKtx = "1.19.0"
kotlinx-datetime = "0.8.0"
kotlinx-collections-immutable = "0.5.2"
arrow = "2.2.3"
supabase = "3.8.0"
credentialsManager = "1.6.0"
googleId = "1.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
