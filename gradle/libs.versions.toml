[versions]
agp = "9.4.0"
android-compileSdk = "37"
android-minSdk = "30"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
composeMultiplatform = "1.12.0"
# Kotlin is capped at 2.4.10 (not 2.4.20) because SKIE 0.10.14 - the newest SKIE release -
# only ships compiler support up to Kotlin 2.4.10 (touchlab/SKIE#205 is still open).
kotlin = "2.4.10"
# Compose Multiplatform publishes material3 on its own track; 1.12.0-alpha03 is the newest
# release in the line matching composeMultiplatform 1.12.0.
material3 = "1.12.0-alpha03"
firebase-gitlive = "2.7.0"
# Matches the BoM that dev.gitlive:firebase-*-android 2.7.0 itself imports.
firebase-bom = "34.18.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
# Koin Annotations 4.2.x drops the KSP processor for a Kotlin compiler plugin; koin-annotations
# is version-aligned with koin-core from 4.2.0 on. koin-compiler is the compiler plugin's own
# version line (id "io.insert-koin.compiler.plugin"); it verifies Kotlin 2.3.20 - 2.4.20, which
# covers the kotlin ref above.
koin = "4.2.2"
koin-annotations = "4.2.2"
koin-compiler = "1.2.1"
ktor = "3.4.2"
# KtorfitX pins Ktor exactly: its Gradle plugin calls checkDependency("io.ktor", "ktor-client-core")
# and errors the build unless the declared version equals KtorfitxVersions.KTOR. For 3.4.2-3.3.3
# that is Ktor 3.4.2, hence the `ktor` value above. The version string itself is <ktor>-<ktorfitx>.
ktorfitx = "3.4.2-3.3.3"
# KSP held at 2.3.11, one behind 2.3.12: 2.3.12 introduces backing-field symbols, which changes
# what Resolver.getSymbolsWithAnnotation returns and requires processors to opt in via
# registerProcessorForNewFeatures + KSVisitorNext. Every processor here is now third-party
# (KtorfitX, KMapper, KspPreferences, Gezgin), so a bump waits on all of them, not on this repo.
ksp = "2.3.11"
moko-resources = "0.27.0"
moko-graphics = "0.10.2"
# Gezgin - type-safe, annotation-driven navigation on top of AndroidX Navigation 3
# (github.com/sahsenvar/Gezgin). Gezgin's own `api` dependency is what pins the Navigation 3 and
# lifecycle-navigation3 versions now, so this repo no longer declares androidx.navigation3 itself.
# 0.3.0 is the release that introduces @ScreenWrapper; see the "Navigation" section of CLAUDE.md.
# Pinned to -SNAPSHOT rather than the release on the owner's own instruction (2026-09-15): 0.3.0
# itself is not published yet, but 0.3.0-SNAPSHOT already carries @ScreenWrapper. Resolved from
# Central's snapshots repository, declared in settings.gradle.kts. Move to the plain "0.3.0" the
# moment that release is cut - a SNAPSHOT coordinate is mutable and was never meant to stay pinned.
gezgin = "0.3.0-SNAPSHOT"
dataStoreVersion = "1.2.1"
# KspPreferences generates the DataStore-backed implementation of every @Preferences interface.
# Its `annotations` artifact publishes android/jvm/iosArm64/iosSimulatorArm64 only - there is no
# iosX64 variant (same as kmapper below).
kspPreferences = "2.0.0"
skie = "0.10.14"
room = "2.8.5"
sqlite = "2.7.1"
coreKtx = "1.19.0"
supabase = "3.8.0"
credentialsManager = "1.6.0"
googleId = "1.2.0"
kmapper = "2.2.2"
detekt = "1.23.8"

