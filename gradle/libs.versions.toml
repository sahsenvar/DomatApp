di-koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
di-koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
di-koin-composeViewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
