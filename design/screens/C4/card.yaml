open:
  - "c4_email_helper, c4_marketing_consent, c4_card_declined_title akışta birebir yok; öneri."
  - "c4_cta_pay'deki tutar gösterimi öneri (akış yalnızca 'Öde ve Siparişi Tamamla' diyor)."
  - "sampleData fiyatları Birim Ekonomisi/Hal verisinden değil, görsel amaçlı."
