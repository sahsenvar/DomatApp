icons:
  source: "Material Symbols Rounded (Apache 2.0) — TEK SET (kural 12). Varsayılan FILL 0; verified_user FILL 1."
  figmaPrefix: "Icon/"
  composePath: "core/resource/src/commonMain/composeResources/drawable/ic_<name>.xml  (siyah dolgu, renk kodda tint ile)"
  set: [add, add_a_photo, apartment, arrow_back, arrow_forward, backspace, broken_image, chat, check, check_circle,
        chevron_right, close, credit_card, delete, description, door_front, eco, error, expand_more, flashlight_on,
        group, help, home, info, keyboard, local_shipping, location_on, lock, logout, notifications, person,
        person_search, photo_camera, photo_library, play_arrow, potted_plant, qr_code_2, receipt_long, refresh,
        remove, schedule, search, settings, share, shopping_basket, sticky_note_2, storefront, sync, trending_down,
        verified_user, videocam, warehouse, warning, wifi_off]
  exempt:
    ic_google: "marka logosu (çok renkli, değiştirilemez)"
    ic_trust_wallet_badge: "iki renkli illüstratif rozet (onboarding)"
    img_effortless_illustration: "illüstrasyon (onboarding)"
  rules:
    - "Renk dosyaya gömülmez; _white/_green gibi renk varyantı dosyası açılmaz. Icon(tint = token) kullanılır."
    - "Yeni ikon: Figma Icon/<ad> + aynı adlı XML aynı commit'te (design-system-change)."
