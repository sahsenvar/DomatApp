# İkonlar: Figma'da "Icon/<ad>" bileşenleri; kodda composeResources/drawable/ic_<ad>.xml (XML Vector Drawable).
# Akış C'nin ihtiyacı: arrow_back, chevron_down, check, info, warning, error, lock, phone, card, whatsapp, success_circle, clock.
icons:
  source: "Material Symbols Rounded (Apache 2.0) — tutarlılık için tek set"
  figmaNodes: { arrow_back: "3:5", chat: "3:10", check: "3:15", check_circle: "3:20", credit_card: "3:25", error: "3:30", expand_more: "3:35", info: "3:40", lock: "3:45", schedule: "3:50", warning: "3:55", share: "Icon/share (Material Icons, C5)" }
  existingInRepo: "ic_arrow_back ve ic_lock repoda eski özel çizim olarak var ve kullanılmaya devam eder; ikon seti birleştirme ayrı karar."
  figmaPrefix: "Icon/"
  composePath: "core/resource/src/commonMain/composeResources/drawable/ic_<name>.xml"
