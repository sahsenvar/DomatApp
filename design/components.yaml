# DomatApp — Bileşen Manifesti
# ─────────────────────────────────────────────────────────────────────────────
# Figma bileşenlerini Compose bileşenlerine eşleyen TEK dosya. Figma Education/Pro planında
# Code Connect olmadığı için onun yerini tutar. Token'lar için bkz. design/tokens/DESIGN.md.
#
# KOD AI İÇİN KURAL:
#   1. Tasarım paketinde (design/screens/<ID>/structure.json) bir Figma örneğinin adı burada
#      `figma.name` olarak geçiyorsa, `compose` sembolünü ÇAĞIR. Yeniden yazma, kopyalama.
#   2. Figma variant/property değerleri `props` eşlemesine göre Kotlin parametresine çevrilir.
#   3. Burada olmayan bir görsel parça görürsen: önce bu dosyaya ekleme ÖNER, ekrana gömme.
#
# TASARIM AI İÇİN KURAL:
#   1. Ekran yalnızca burada listelenen bileşenlerin Figma örnekleriyle kurulur.
#   2. Figma variant property adları Kotlin parametre adlarıyla BİREBİR aynıdır (camelCase).
#   3. `status: new` bileşen önce Figma kütüphanesine ve bu dosyaya eklenir, sonra kullanılır.
#
# status:
#   existing  → kodda var, olduğu gibi kullanılır
#   change    → kodda var, belirtilen değişiklik gerekir
#   promote   → bir feature modülünde var, :core:presentation'a taşınmalı
#   new       → kodda yok, yazılacak
#
# spec: bileşenin İÇ ölçüleri (dolgu, aralık, boyut, yazı stili, kenarlık). Figma bileşeni ile Compose
#   bileşeni bu değerlerde BİREBİR aynı olmalıdır; biri değişirse diğeri aynı commit'te güncellenir.
#   Kod AI'ı `new` bileşeni yazarken bu değerleri kullanır — tahmin etmez.
#
# swiftui: CMP'nin yetmediği yerde iOS'ta ayrı karşılık gerekirse doldurulur; şimdilik hepsi null.
# figma.nodeId: "DomatApp — Design System" dosyasındaki (5hpUTmJJ1ie3E9boGSPXje) bileşen seti düğümü.
# figma.key: Figma kütüphanesi yayınlandığında component key ile doldurulur.
# ─────────────────────────────────────────────────────────────────────────────

