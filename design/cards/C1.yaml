# Ekran kartı — Akış → Tasarım sözleşmesi (bkz. DomatApp_Tasarim_Katmani_Degerlendirme §6.1)
# Doğru kaynak akış dokümanıdır; bu kart onun türevidir. Çelişki olursa akış dokümanı kazanır ve kart güncellenir.
id: C1
title: Telefon Numarası Girişi + KVKK Onayı
source: DomatApp_Akis_C_Giris_Odeme_v1.4.md#C1
route: { name: CheckoutGraph.PhoneEntryRoute, status: proposed }
purpose: >
  Misafir kullanıcıdan hesabın tek kimliği olacak telefon numarasını almak ve numara işlenmeden
  önce KVKK açık onayını almak. Geçerli oturumu olan kullanıcı bu ekranı hiç görmez.
frame: { width: 390, height: 844 }

regions:
  - id: header
    component: ScreenHeader
    props: { title: str.c1_title, showBack: true }
  - id: rationale
    component: text
    style: body-medium / on-surface-variant
    text: str.c1_rationale
  - id: phone
    component: PhoneNumberField
    props: { value: "", state: default }
  - id: kvkk
    component: ConsentCheckbox
    props: { label: str.c1_kvkk_label, checked: false, expandable: true, expanded: false }
    legalText: str.c1_kvkk_legal_text   # uzun metin, sunucudan da gelebilir — tasarımda ilk 3 satır + "Metni oku"
  - id: cta
    component: BottomActionBar
    content:
      - component: PrimaryButton
        props: { text: str.c1_cta, size: Large, enabled: "phoneValid && kvkkChecked", loading: "otpRequestInFlight" }

states:
  - id: default
    description: Boş numara, KVKK işaretsiz, buton pasif.
  - id: ready
    description: Geçerli numara girilmiş, KVKK işaretli, buton aktif.
  - id: phone-invalid
    description: Numara formatı hatalı; PhoneNumberField state=error + supportingText str.c1_phone_error.
  - id: kvkk-expanded
    description: KVKK metni genişletilmiş (okuma durumu).
  - id: sending
    description: OTP isteği sürüyor; PrimaryButton loading=true.

data:
  uiState: ["phoneDigits: String", "isPhoneValid: Boolean", "kvkkChecked: Boolean", "kvkkExpanded: Boolean", "isSending: Boolean", "errorMessage: String?"]
actions: [PhoneChanged(digits), KvkkToggled, KvkkExpandToggled, SendCodeClicked, BackClicked]
navigation:
  - { on: BackClicked, action: back, note: "Sepete döner; sepet etkilenmez." }
  - { on: otpRequested, goTo: C2, args: [phoneNumber] }
api: ["POST /v1/users/me/kvkk-consent", "POST /v1/auth/otp/request"]

strings:
  c1_title: "Telefon Numaran"
  c1_rationale: "Siparişini tamamlamak için telefon numaranı doğrulayalım. Teslimat kodun ve dağıtıcımızın seninle iletişimi için gerekli."
  c1_phone_label: "Telefon numarası"
  c1_phone_error: "Geçerli bir cep telefonu numarası gir (5XX XXX XX XX)."
  c1_kvkk_label: "KVKK Aydınlatma Metni'ni okudum, kişisel verilerimin işlenmesine açık rıza veriyorum."
  c1_kvkk_read_more: "Metni oku"
  c1_kvkk_legal_text: "<KVKK aydınlatma metni — hukuk tarafından sağlanacak; telefon, ad-soyad, e-posta, adres ve ödeme/fatura bilgisini kapsar>"
  c1_cta: "Kod Gönder"

open:
  - "c1_title akış dokümanında tanımlı değil; öneri. Onay bekliyor."
