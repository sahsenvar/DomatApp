sampleData:
  deliveryCode: "#DAL1"
  selectedItems:
    - { productName: "Domates", variant: "Tarla", quantityLabel: "2 file", chargedAmount: "₺172,00" }
    - { productName: "Domates", variant: "Çeri", quantityLabel: "1 kutu", chargedAmount: "₺41,00" }
  singleItem: "İade edilecek: Domates — Tarla, 2 file"
  reasonCode: crushed
  reasonText: "Kutu ezik geldi, domateslerin yarısı patlamıştı."
  reasonTextCounter: "48/240"
  photos: ["photo_1.jpg", "photo_2.jpg"]
  videoDuration: "0:08"

open:
  - "Ekran başlığı ('İade Talebi'), bölüm başlıkları ('İade edilecek ürünler', 'Sorun ne?', 'Fotoğraflar', 'Video'), fotoğraf yardım metni ('En az 1, en fazla 4 fotoğraf'), 'Fotoğraf Ekle' slot etiketi ve '%1$d/240' sayaç akışta yok — öneri."
  - "Sebep etiketleri akışta küçük harfle (ezilmiş / küflü / az gelmiş / yanlış ürün / diğer) geçiyor; kartta ilk harf büyük yazıldı."
  - "'Diğer' seçiliyken zorunluluk yalnızca etikette '*' ile ve pasif butonla gösteriliyor; min. 10 karakter altı için hata metni akışta yok. Satır içi hata mesajı istenir mi?"
  - "409 item_already_returned (kalem bu sırada başka talebe girdi) için kullanıcı metni akışta tanımsız; kart G1'e dönüp listeyi tazelemeyi öneriyor."
  - "Süre doldu bandındaki WhatsApp aksiyonu G5'teki 'Destek: WhatsApp' metnini kullanıyor; D2 Edge Case 5'te buton metni yok."
