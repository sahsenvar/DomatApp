  d1_status_confirmed: "Onaylandı"
  d1_status_partially_confirmed: "Kısmen Onaylandı"
  d1_status_all_failed: "Ödeme Tamamlanamadı"
  d1_status_delivery_today: "Teslimat Bugün"
  d1_status_delivery_soon: "Teslimat Yakında"
  d1_status_delivered: "Teslim Edildi"
  d1_status_cancelled: "İptal Edildi"
