  d1_line_processing: "Ödemen işleniyor"
  d1_line_charged: "%1$d ekleme · %2$s çekildi"
  d1_line_released_suffix: ", %1$s serbest bırakıldı"
  d1_line_failed_count: "%1$d kalem düştü"
  d1_line_delivery_day: "%1$s teslimat"
  d1_line_delivered: "Teslim edildi"
  d1_line_cancelled: "İptal edildi"
  d1_line_block_released: "Bloke serbest bırakıldı"
  d1_returns_link: "İade Taleplerim"
  d1_empty_title: "Henüz siparişin yok"
  d1_empty_cta: "Pazar'a Git"

sampleData:
  selectedTab: active
  activeDeliveries:
    - { deliveryCode: "#DAL1", statusLabel: "Bekleniyor", statusBadgeVariant: Neutral, summaryLine: "2 ekleme · ₺188,00 kartında bekletiliyor", orderCount: 2, blockedAmount: "₺188,00" }
  activePartial:
    - { deliveryCode: "#DAL1", statusLabel: "Kısmen Onaylandı", statusBadgeVariant: Warning, summaryLine: "2 ekleme · ₺135,00 çekildi, ₺53,00 serbest bırakıldı · 1 kalem düştü", chargedAmount: "₺135,00", releasedAmount: "₺53,00", failedCount: 1 }
  activeOverlap:
    - { deliveryCode: "#DAL1", statusLabel: "Teslimat Yakında", statusBadgeVariant: Delivery, summaryLine: "Cumartesi teslimat", deliveryWeekday: "Cumartesi" }
    - { deliveryCode: "#DAL1", statusLabel: "Bekleniyor", statusBadgeVariant: Neutral, summaryLine: "1 ekleme · ₺96,00 kartında bekletiliyor" }
  historyDeliveries:
    - { dateLabel: "Cumartesi, 26 Eylül", statusLabel: "Teslim Edildi", statusBadgeVariant: DeliveryMuted, totalAmount: "₺171,00" }
    - { dateLabel: "Cumartesi, 19 Eylül", statusLabel: "Teslim Edildi", statusBadgeVariant: DeliveryMuted, totalAmount: "₺84,00" }
    - { dateLabel: "Cumartesi, 12 Eylül", statusLabel: "İptal Edildi", statusBadgeVariant: Muted, totalAmount: "₺0,00" }
  hasReturnRequests: true
  hasUnseenStatusChange: true

open:
  - "Ekran başlığı 'Siparişler' Nav §2/§3.1'deki sekme adından alındı; D1 başlık metni vermiyor."
  - "Tutar biçimi: akış 'X TL' yazıyor, kartlar Akış C ile tutarlı olarak '₺188,00' biçimini kullanıyor — tek biçim kararı gerekli."
  - "'cancelled' kartında akış hem 'İptal edildi' (D1 alt satır) hem 'Bloke serbest bırakıldı' (Edge case 2 kalıp 3) diyor; ikisi ' · ' ile birleştirildi — öneri."
  - "'1 kalem düştü': düşme birimi sipariştir (§4.2), metin 'kalem' diyor — akıştan birebir alındı, terim tutarsızlığı Sahan'a."
  - "Geçmiş satırında iptal edilen teslimatın 'toplam tutarı' ne gösterilir (₺0,00 mı, bloke edilen mi)? Akışta yok, öneri ₺0,00."
  - "Teslimat kodu haftalar arası aynı mı (#DAL1)? Çakışma durumunda (active-overlap) iki kart aynı kodla görünüyor; ayırt edici bilgi (tarih) gerekebilir."
  - "'İade Taleplerim' linki (G4 girişi) D akışında yok — G §8 soru 5; öneri: Geçmiş listesinin altında TextLink."
  - "Yükleniyor / ağ hatası durumları akışta tanımlı değil (B1 kalıbı uygulanabilir)."
  - "Boş durum ikonu (receipt_long) öneri."
