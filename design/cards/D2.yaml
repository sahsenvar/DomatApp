open:
  - "Başarısızlık metni akışta tek cümle ('Ödemen tamamlanamadı, bu kalemi...'); InfoBanner başlık + gövde olarak ikiye bölündü — öneri."
  - "Sipariş satırı rozet metinleri (chargeStatus bazlı) akışta yok, öneri: teslimat rozetleriyle aynı kelimeler."
  - "'Tahmini teslimat' etiketi (C5'ten), 'İptal hakkın ... kadar geçerli' notu, 'KareKod'u Göster' ve 'Siparişler' bölüm başlığı akışta yok, öneri."
  - "Ödeme Özeti 'fiyat X TL/kg'a indi': çok ürünlü teslimatta hangi ürünün kg fiyatı yazılacak? Akışta tanımsız; örnekte Domates."
  - "all_failed için ayrı metin yok; kısmi başarısızlık kalıbı tüm kalemlerle kullanıldı — onay gerekli."
  - "İade butonu 'pasif görünür ama dokunulabilir' — M3 disabled butonu tıklanmaz; özel görünüm (enabled=false görünüm + tıklama) kod tarafında gerekir."
  - "'Teslimatı İptal Et' buton vurgusu akışta yok; öneri SecondaryButton (asıl kırmızı onay D4'te)."
  - "Türkçe ek uyumu ('%1$s'den', '%1$s'e kadar', '%1$s'a indi') kodda üretilmeli — şablonlar yalnızca örnek."
  - "İptal tarihi satırı biçimi akışta yok ('+ tarih'); öneri: 'İptal tarihi' InfoRow."
