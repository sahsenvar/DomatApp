  g5_msg_approved: "Talebin onaylandı. %1$s iade edilecek."
  g5_msg_refunded: "%1$s kartına iade edildi. Kartına yansıma süresi bankana göre değişebilir."
  g5_rejected_title: "Bu talebi onaylayamadık."
  g5_rejected_body: "Farklı bir sorun yaşarsan tekrar talep açabilirsin."
  g5_rejected_body_note: "%1$s Farklı bir sorun yaşarsan tekrar talep açabilirsin."
  g5_msg_withdrawn: "Bu talebi geri çektin. Aynı ürün için tekrar talep açabilirsin."
  g5_items_title: "İade edilen ürünler"
  g5_delivery_label: "Teslimat"
