sampleData:
  returnCode: "#İAD-2381"
  deliveryCode: "#DAL1"
  deliveryDay: "Cumartesi, 3 Ekim"
  items:
    - { productName: "Domates", variant: "Tarla", quantityLabel: "2 file", chargedAmount: "₺172,00" }
    - { productName: "Domates", variant: "Çeri", quantityLabel: "1 kutu", chargedAmount: "₺41,00" }
  photos: ["photo_1.jpg", "photo_2.jpg"]
  videoDuration: "0:08"
  reasonLabel: "Ezilmiş"
  reasonText: "Kutu ezik geldi, domateslerin yarısı patlamıştı."
  refundAmount: "₺213,00"
  decisionNote: "Fotoğraflarda ezilme net seçilemedi."
  msgApproved: "Talebin onaylandı. ₺213,00 iade edilecek."
  msgRefunded: "₺213,00 kartına iade edildi. Kartına yansıma süresi bankana göre değişebilir."

open:
  - "Tutar biçimi: akış '[X] TL' diyor; ürünün para biçimi '₺213,00'. Kart metinden 'TL'yi çıkarıp yer tutucuya ₺'li tutar koydu — onay gerekiyor (G7 push metinleri de aynı)."
  - "Akış §8 soru 1 (rejected durumu v1'de var mı) ve soru 8 (decisionNote opsiyonel mi) hâlâ açık; kart rejected'ı ve opsiyonel notu çizdi."
  - "Bölüm başlıkları ('İade edilen ürünler', 'Gönderdiğin fotoğraf ve video', 'Sebep', 'Sorun'), 'Görüntüle' linki ve 409 already_reviewed snackbar metni akışta yok — öneri."
  - "rejected mesaj tonu: InfoBanner warning (belirgin ama sert olmayan) seçildi; error tonu kasıtlı olarak kullanılmadı."
  - "Tam ekran fotoğraf görüntüleyici ve video oynatıcı için ayrı kart yok; platform bileşeni mi, özel ekran mı kararı gerekiyor."
  - "'İade edilen ürünler' başlığı pending/rejected durumunda yanıltıcı olabilir; 'Talepteki ürünler' alternatifi."
