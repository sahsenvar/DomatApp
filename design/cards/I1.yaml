sampleData:
  fullName: "Elif Yılmaz"
  maskedPhone: "+90 5XX XXX XX 67"
  siteName: "Dalyan Sitesi"
  blockName: "A Blok"
  savedCardLabel: "Visa •••• 4242"
  pendingDeliveryCode: "#DAL1"
  appVersion: "1.0.0 (42)"

open:
  - "i1_title ('Hesap'), i1_app_version ('Sürüm %1$s'), i1_pending_deletion_title/body akışta yok, öneri."
  - "Silinme sürecindeki kullanıcının tekrar girişte göreceği 'salt-bilgi ekran' (I8 Edge Case 2) akışta kod/ID almamış; I1 üst bandı olarak modellendi — ayrı tam ekran mı, bant mı? Bu durumda hangi satırlar (örn. Hesabımı Sil, Çıkış Yap) gizlenmeli?"
  - "'Tehlikeli Alan' akışta grup adı; ekranda görünür başlık olarak mı kalsın, yoksa başlıksız ayrık grup mu? (öneri: görünür başlık kaldırılabilir)."
  - "Maskeleme biçimi: akış '+90 5XX XXX XX 34', C2 kartı '+90 532 *** ** 67' — tek biçim seçilmeli."
  - "Misafir 'Telefon ile giriş yap' → C1 sonrası nereye dönülür (Hesap mı, Pazar mı) ve sepet devri (cart/merge) bu kapıdan da tetiklenir mi — akışta tanımsız; Navigasyon'un 'tek giriş kapısı Siparişi Tamamla' ilkesiyle de gerilimli."
  - "WhatsAppFab bu ekranda da duruyor mu, yoksa 'Destek: WhatsApp' satırı onun yerini mi alıyor — akış belirsiz; kartta FAB çizilmedi."
  - "Kayıtlı Kartlarım satırı Akış I §8 Soru 1'e bağlı (koşullu)."
